<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Att.Ui-UX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="menu_login">
    <img src="image copy.png" alt="Ilustração de login" height="25%" style="margin-left: 30%; margin-top: 36%;">
  </div>

  <div class="menu2">
    <h1>Criar Conta</h1>
    <b>Preencha os campos abaixo para se cadastrar</b>

    <label for="inputemail">Email</label>
    <input id="inputemail" class="inputemail" type="email" placeholder="Digite seu Email">

    <label for="inputusuario">Nome de Usuário</label>
    <input id="inputusuario" class="inputusuario" type="text" placeholder="Digite seu Usuário">

    <label for="inputsenha">Senha</label>
    <input id="inputsenha" class="inputsenha" type="password" placeholder="Digite sua senha">

    <label class="lembrar-me" for="lembrar">
      <input id="lembrar"" type="checkbox" checked>
      <span>Lembrar-me</span>
    </label>

    <button type="submit" class="btn-criar">Criar</button>

    <p class="barras">Crie com</p>

    <p class="rodape-login">
      Já possui uma conta? <a href="#">Log in</a>
    </p>
  </div>
</body>
</html>
